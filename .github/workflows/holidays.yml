name: Update holidays

on:
  schedule:
    - cron: '0 0 1 * *'   # 매달 1일 09:00 (한국 시간)
  workflow_dispatch:       # Actions 탭에서 직접 실행할 수도 있어요

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 공휴일 받아오기
        env:
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
        run: node scripts/fetch-holidays.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          if git diff --quiet -- holidays.json; then
            echo "바뀐 공휴일이 없어요."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holidays.json
          git commit -m "공휴일 자료 업데이트"
          git push

      # 공개 저장소는 60일 동안 활동이 없으면 예약 실행이 멈춰요. 매번 다시 켜 둬서 멈추지 않게 해요.
      - name: 예약 실행 유지
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable holidays.yml --repo "$GITHUB_REPOSITORY" || true
